<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17324d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="簿記1級" />
  <title>簿記1級 通勤TRAINING</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">日商簿記1級</p>
      <h1>通勤TRAINING</h1>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">＋ インストール</button>
  </header>

  <main id="app" class="app-shell">
    <section id="homeView" class="view active">
      <article class="hero card">
        <div class="hero-head">
          <div>
            <p class="muted">今日の通勤学習</p>
            <h2>10問だけ、確実に積み上げる</h2>
          </div>
          <div class="streak">🔥 <span id="streakDays">1</span>日</div>
        </div>
        <div class="progress-row">
          <span>今日の進捗</span><strong id="todayText">0 / 10問</strong>
        </div>
        <div class="progress"><div id="todayBar"></div></div>
        <button id="dailyBtn" class="primary wide" type="button">▶ 今日の10問</button>
      </article>

      <section class="quick-grid" aria-label="学習メニュー">
        <button id="commuteBtn" class="menu-card" type="button"><span>⚡</span><b>通勤5分</b><small>短問5問</small></button>
        <button id="wrongBtn" class="menu-card" type="button"><span>❌</span><b>間違い復習</b><small id="wrongCount">0問</small></button>
        <button id="favoriteBtn" class="menu-card" type="button"><span>⭐</span><b>お気に入り</b><small id="favoriteCount">0問</small></button>
        <button id="weakBtn" class="menu-card" type="button"><span>🎯</span><b>苦手優先</b><small>正答率を分析</small></button>
      </section>

      <article class="card">
        <div class="section-title"><h2>分野別学習</h2><button id="allTopicsBtn" class="text-btn" type="button">全論点</button></div>
        <div id="topicButtons" class="topic-grid"></div>
      </article>

      <article class="card">
        <div class="section-title"><h2>学習状況</h2><button id="statsBtn" class="text-btn" type="button">詳しく見る</button></div>
        <div class="stats-grid">
          <div><strong id="statAnswered">0</strong><span>総解答</span></div>
          <div><strong id="statRate">--</strong><span>正答率</span></div>
          <div><strong id="statWeak">0</strong><span>要復習</span></div>
        </div>
      </article>

      <article class="card install-guide">
        <h2>📱 ホーム画面から起動</h2>
        <p>HTTPSで公開後、Chromeの「ホーム画面に追加」またはインストール案内から登録できます。2回目以降はアプリアイコンから起動できます。</p>
      </article>
    </section>

    <section id="quizView" class="view">
      <div class="quiz-top">
        <button id="backBtn" class="ghost" type="button">← ホーム</button>
        <div><span id="modeLabel">学習</span> <strong id="counter">1 / 5</strong></div>
      </div>
      <article class="card quiz-card">
        <div class="quiz-meta">
          <div>
            <span id="subjectBadge" class="badge"></span>
            <span id="topicBadge" class="badge soft"></span>
            <span id="typeBadge" class="badge soft"></span>
          </div>
          <button id="starBtn" class="star" type="button" aria-label="お気に入り">☆</button>
        </div>
        <h2 id="questionText" class="question"></h2>
        <p id="questionNote" class="question-note hidden"></p>
        <div id="answerArea"></div>
        <div id="feedback" class="feedback hidden" aria-live="polite"></div>
        <button id="nextBtn" class="primary wide hidden" type="button">次の問題 →</button>
      </article>
    </section>

    <section id="resultView" class="view">
      <article class="card result-card">
        <div class="result-icon">🎉</div>
        <h2>学習完了</h2>
        <div id="resultScore" class="result-score"></div>
        <p id="resultMessage" class="muted"></p>
        <div id="resultWeakTopics" class="result-weak"></div>
        <button id="resultHomeBtn" class="primary wide" type="button">ホームへ</button>
      </article>
    </section>

    <section id="statsView" class="view">
      <div class="quiz-top">
        <button id="statsBackBtn" class="ghost" type="button">← ホーム</button>
        <strong>学習分析</strong>
      </div>
      <article class="card">
        <h2>総合</h2>
        <div class="stats-grid large">
          <div><strong id="sAnswered">0</strong><span>総解答</span></div>
          <div><strong id="sRate">--</strong><span>正答率</span></div>
          <div><strong id="sStreak">0</strong><span>連続日数</span></div>
        </div>
      </article>
      <article class="card">
        <h2>論点別正答率</h2>
        <div id="topicStats" class="topic-stats"></div>
      </article>
      <article class="card">
        <h2>最近の学習</h2>
        <div id="recentHistory" class="history-list"></div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
